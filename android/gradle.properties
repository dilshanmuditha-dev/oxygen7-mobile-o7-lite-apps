org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
#android.enableR8=false

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

android.suppressUnsupportedCompileSdk=34,36
# Path to Java 17 JDK
#org.gradle.java.home= # set locally; do not commit a machine-specific path

# Kotlin JVM target configuration
kotlin.jvm.target.validation.mode=WARNING

# Disable baseline profile verification to fix installation errors
android.experimental.enableVerifyDexDebuggability=false
android.disableInstallBaselines=true