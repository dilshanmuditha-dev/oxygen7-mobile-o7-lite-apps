name: app
description: O7Lite payment application.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+7

environment:
  sdk: ">=3.4.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  barcode_widget: ^2.0.0
  crypto: ^3.0.2
  cupertino_icons: ^1.0.2
  device_info_plus: ^9.0.3
  enum_to_string: ^2.0.1
  esc_pos_utils: ^1.1.0
  flutter:
    sdk: flutter
  shimmer: ^3.0.0
  fluttertoast: ^8.2.12
  intl: ^0.18.0
  qr_flutter: ^4.1.0
  sunmi_printer_plus: 3.0.1

  mobile_scanner: ^7.0.1
  photo_manager: ^3.0.0-dev.2
  awesome_dialog: ^3.1.0
  dio: ^5.3.0
  flutter_easyloading: ^3.0.5
  flutter_svg: ^2.0.0
  get: ^4.6.5
  material_dialogs: ^1.1.4
  json_annotation: ^4.9.0
  lottie: ^2.7.0
  url_launcher: ^6.2.3
  flutter_multi_formatter: ^2.12.4
  animated_text_kit: ^4.2.2
  flutter_jailbreak_detection: ^1.10.0
  shared_preferences: ^2.2.2
  dropdown_button2: ^2.3.9
  external_app_launcher: ^4.0.0
  open_settings_plus: ^0.4.0
  volume_controller: ^2.0.7
  package_info_plus: ^8.3.0
  animate_do: ^3.3.4
  audioplayers: ^5.2.1
  flutter_blue_plus: ^1.32.1
  just_audio: ^0.9.40
  
  # Diagnostic packages
  battery_plus: ^6.0.0
  connectivity_plus: ^6.0.0
  network_info_plus: ^6.0.0

  permission_handler: ^11.3.1
  share_plus: ^11.0.0
  easy_loading_button: ^0.3.2
  carousel_slider: ^5.0.0

  # Security Audited: Legacy cipher references are informational only (SDK checks)
  # Mitigated via Network Security Config and WebView hardening
  # See: docs/SECURITY_AUDIT_LEGACY_ENCRYPTION.md
  flutter_inappwebview: ^6.0.0

  url_launcher_ios: ^6.3.1

  pdf: ^3.8.4
  # printing: ^5.13.2
  path_provider: ^2.0.11

  # Secure storage with AES-GCM encryption (replaces vulnerable AES-CBC)
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.1.0

  envied: ^0.5.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.1.0
  json_serializable: ^6.6.1
  animate_gradient: ^0.0.2+1
  build_runner: ^2.4.9
  envied_generator: ^0.5.4+1
  xml: ^6.5.0

# Add the following dependency overrides for iOS & macOS, as needed -->
dependency_overrides:
  flutter_inappwebview_ios:
    git:
      url: https://github.com/andychucs/flutter_inappwebview.git
      ref: master
      path: flutter_inappwebview_ios

  flutter_inappwebview_macos:
    git:
      url: https://github.com/andychucs/flutter_inappwebview.git
      ref: master
      path: flutter_inappwebview_macos
      
flutter_icons:
  android: "launcher_icon"
  ios: true

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/o7lite/images/
    - assets/o7lite/icons/
    - assets/o7lite/sound/
